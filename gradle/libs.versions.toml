[versions]
assertj = "3.27.6"
boot3 = "3.5.4"
boot4 = "4.0.0-M1"
jackson2 = "2.20.0"
jackson3 = "3.0.0-rc10"
junit = "5.14.0"
mockwebserver = "4.12.0"
reactor = "3.8.0-M5"
spring6 = "6.2.10"
spring7 = "7.0.0-M7"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
reactor-core = { module = "io.projectreactor:reactor-core", version.ref = "reactor" }
reactor-test = { module = "io.projectreactor:reactor-test", version.ref = "reactor" }
spring-boot3-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "boot3" }
spring-boot3-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "boot3" }
spring-boot3-test = { module = "org.springframework.boot:spring-boot-test", version.ref = "boot3" }
spring-boot4-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "boot4" }
spring-boot4-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "boot4" }
spring-boot4-test = { module = "org.springframework.boot:spring-boot-test", version.ref = "boot4" }
spring6-web = { module = "org.springframework:spring-web", version.ref = "spring6" }
spring6-webflux = { module = "org.springframework:spring-webflux", version.ref = "spring6" }
spring7-web = { module = "org.springframework:spring-web", version.ref = "spring7" }
spring7-webflux = { module = "org.springframework:spring-webflux", version.ref = "spring7" }

[plugins]
