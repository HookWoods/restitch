name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  full-reactor:
    name: Full reactor
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify full reactor
        run: ./gradlew check

  publication-dry-run:
    name: Publication dry run
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify publication task graph
        run: ./gradlew check publishToMavenLocal --dry-run

  samples:
    name: ${{ matrix.sample }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample:
          - samples/boot3-mvc-sample
          - samples/boot4-webflux-sample
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify sample
        run: bash .github/verify-sample.sh "${{ matrix.sample }}"

  boot-generation:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - modules/aggregation-spring-boot3-autoconfigure
          - modules/aggregation-spring-boot4-autoconfigure
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify generation module
        run: ./gradlew ":${{ matrix.module }}:check"
