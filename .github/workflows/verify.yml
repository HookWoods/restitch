name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-notes:
    name: Release notes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an Unreleased changelog entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          unreleased_section() {
            git show "$1:CHANGELOG.md" | awk '
              /^## Unreleased$/ { in_section = 1; next }
              in_section && /^## / { exit }
              in_section { print }
            '
          }

          if [[ "$(unreleased_section "$BASE_SHA")" == "$(unreleased_section "$HEAD_SHA")" ]]; then
            echo "Update the Unreleased section in CHANGELOG.md for this pull request." >&2
            exit 1
          fi

  full-reactor:
    name: Full reactor
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify full reactor
        run: ./gradlew check

  publication-dry-run:
    name: Publication dry run
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify publication task graph
        run: ./gradlew check publishToMavenLocal --dry-run

  samples:
    name: ${{ matrix.sample }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample:
          - samples/boot3-mvc-sample
          - samples/boot4-webflux-sample
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify sample
        run: bash .github/verify-sample.sh "${{ matrix.sample }}"

  boot-generation:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - ":modules:aggregation-spring-boot3-autoconfigure"
          - ":modules:aggregation-spring-boot4-autoconfigure"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify generation module
        run: ./gradlew "${{ matrix.module }}:check"
