name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify release tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Verify reactor
        run: ./gradlew -PreleaseVersion="${GITHUB_REF_NAME#v}" clean check
      - name: Publish signed artifacts to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          for secret in \
            ORG_GRADLE_PROJECT_mavenCentralUsername \
            ORG_GRADLE_PROJECT_mavenCentralPassword \
            ORG_GRADLE_PROJECT_signingInMemoryKey \
            ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            test -n "${!secret}" || { echo "Missing required secret: $secret" >&2; exit 1; }
          done
          ./gradlew -PreleaseVersion="${GITHUB_REF_NAME#v}" publishAndReleaseToMavenCentral
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_NAME#v}"
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG_NAME" > release-notes.md
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "Restitch $TAG_VERSION" --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" --title "Restitch $TAG_VERSION" --notes-file release-notes.md
          fi

  build-api-docs:
    name: Build API docs
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate Javadocs
        run: ./gradlew javadoc
      - name: Assemble API reference site
        run: |
          mkdir -p _site
          cp docs/api/index.html _site/index.html
          cp -R modules/aggregation-api/build/docs/javadoc _site/api
          cp -R modules/aggregation-json-spi/build/docs/javadoc _site/json-spi
          cp -R modules/aggregation-core/build/docs/javadoc _site/core
          cp -R modules/aggregation-spring-boot3-autoconfigure/build/docs/javadoc _site/spring-boot3
          cp -R modules/aggregation-spring-boot4-autoconfigure/build/docs/javadoc _site/spring-boot4
      - name: Upload API reference site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-api-docs:
    name: Deploy API docs
    needs: build-api-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy API reference site
        id: deployment
        uses: actions/deploy-pages@v4
